<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Login - BOLT BILLINGs</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 40px 30px;
            text-align: center;
        }
        
        .logo-img {
            height: 80px;
            margin-bottom: 15px;
            border-radius: 50%;
            border: 4px solid #ffd700;
        }
        
        .login-title {
            color: white;
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        
        .login-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin: 0;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .form-label {
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        
        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .login-footer {
            text-align: center;
            padding-top: 20px;
            color: #666;
            font-size: 0.9rem;
        }
        
        .login-footer i {
            color: #667eea;
        }
        
        .input-group-text {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border: 2px solid #e0e0e0;
            border-right: none;
        }
        
        .input-group .form-control {
            border-left: none;
        }
        
        .alert {
            border-radius: 10px;
            border: none;
        }
        
        .lightning-icon {
            font-size: 3rem;
            color: #ffd700;
            margin-bottom: 10px;
        }
    </style>
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
    <div class='login-container'>
        <div class='login-card'>
            <div class='login-header'>
                <i class='bi bi-lightning-charge-fill lightning-icon'></i>
                <h1 class='login-title'>BOLT BILLINGs</h1>
                <p class='login-subtitle'>Secure Login</p>
            </div>
            
            <div class='login-body'>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class='alert alert-{{ category }} alert-dismissible fade show mb-4' role='alert'>
                                <i class='bi bi-{% if category == "success" %}check-circle{% elif category == "error" %}x-circle{% else %}info-circle{% endif %} me-2'></i>
                                {{ message }}
                                <button type='button' class='btn-close' data-bs-dismiss='alert'></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form method='POST' action='{{ url_for("login") }}'>
                    <div class='mb-4'>
                        <label for='username' class='form-label'>
                            <i class='bi bi-person-fill me-2'></i>User ID
                        </label>
                        <div class='input-group'>
                            <span class='input-group-text'>
                                <i class='bi bi-person'></i>
                            </span>
                            <input type='text' 
                                   class='form-control' 
                                   id='username' 
                                   name='username' 
                                   placeholder='Enter User ID'
                                   required
                                   autofocus
                                   autocomplete='username'>
                        </div>
                    </div>
                    
                    <div class='mb-4'>
                        <label for='password' class='form-label'>
                            <i class='bi bi-lock-fill me-2'></i>Password
                        </label>
                        <div class='input-group'>
                            <span class='input-group-text'>
                                <i class='bi bi-lock'></i>
                            </span>
                            <input type='password' 
                                   class='form-control' 
                                   id='password' 
                                   name='password' 
                                   placeholder='Enter Password'
                                   required
                                   autocomplete='current-password'>
                        </div>
                    </div>
                    
                    <div class='mb-4'>
                        <div class='form-check'>
                            <input class='form-check-input' type='checkbox' id='rememberMe'>
                            <label class='form-check-label' for='rememberMe'>
                                Remember me
                            </label>
                        </div>
                    </div>
                    
                    <button type='submit' class='btn btn-primary btn-login w-100'>
                        <i class='bi bi-box-arrow-in-right me-2'></i>Login
                    </button>
                </form>
                
                <div class='login-footer'>
                    <p class='mb-2'>
                        <i class='bi bi-shield-check me-1'></i>
                        Secure & Encrypted
                    </p>
                    <p class='mb-0 text-muted small'>
                        Default: User ID <strong>ADMIN</strong> | Password <strong>1111</strong>
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'></script>
    <script>
        // Focus on username field when page loads
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('username').focus();
        });
        
        // Allow Enter key to submit form
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.querySelector('form').submit();
            }
        });
    </script>
</body>
</html>
